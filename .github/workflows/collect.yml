name: Collect X metrics

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-07-27"
      end_date:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-08-01"
      save_limit:
        description: "How many rows to save; 0 = all"
        required: true
        default: "10"
  schedule:
    - cron: "0 8 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run collector
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          CONTENT_PULSE_DATABASE_ID: ${{ secrets.CONTENT_PULSE_DATABASE_ID }}
          X_COOKIES_JSON: ${{ secrets.X_COOKIES_JSON }}
          X_HANDLE: Mylovanov
          START_DATE: ${{ github.event.inputs.start_date || '2026-07-27' }}
          END_DATE: ${{ github.event.inputs.end_date || '2026-08-01' }}
          SAVE_LIMIT: ${{ github.event.inputs.save_limit || '10' }}
          MAX_SCROLLS: "260"
        run: python x_pilot.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-debug-screenshots
          path: |
            x_debug_home.png
            x_debug_after_scroll.png
          if-no-files-found: ignore
